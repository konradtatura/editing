<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="base.css" />
    <style>
      canvas { position: absolute; left: 0; top: 0; }
      .col { left: 160px; top: 0; width: 740px; height: 1080px; display: flex; flex-direction: column; justify-content: center; }
      .h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; }
      .sub { font-size: 40px; font-weight: 400; color: var(--mute); margin-top: 10px; letter-spacing: -0.01em; }
      .six { display: flex; align-items: flex-end; gap: 26px; margin-top: 70px; }
      .six .n { font-size: 330px; font-weight: 900; letter-spacing: -0.06em; line-height: 0.78; }
      .six .l { font-size: 76px; font-weight: 300; letter-spacing: -0.035em; line-height: 1.02; padding-bottom: 6px; }
      .eq { margin-top: 70px; }
      .eq .r { font-size: 40px; font-weight: 500; color: var(--mute); letter-spacing: -0.01em; }
      .eq .s { white-space: nowrap; font-size: 112px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.05; margin-top: 6px; }
      .eq .s span { font-weight: 300; color: var(--mute); font-size: 64px; letter-spacing: -0.03em; }
      .shade { position: absolute; left: 0; top: 0; width: 900px; height: 1080px; background: var(--bg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.0" data-width="1920" data-height="1080">
      <div class="cam" id="cam"><canvas id="cv" width="1920" height="1080"></canvas></div>
      <div class="shade" id="shade"></div>
      <div class="abs col">
        <div class="h1" id="h1">Cały polski internet</div>
        <div class="sub" id="sub"><span id="users">0</span> osób każdego dnia</div>
        <div class="six" id="six"><div class="n" id="n6">6</div><div class="l" id="l6"><div id="l6a">osób</div><div id="l6b">dziennie</div></div></div>
        <div class="eq" id="eq">
          <div class="r" id="eqr">6 × 59 zł × 30 dni</div>
          <div class="s" id="eqs"><b id="sum">0 zł</b> <span>/ mies.</span></div>
        </div>
      </div>
      <div class="vign"></div>
      <div class="grain"></div>
    </div>
    <script src="kit.js"></script>
    <script>
      // words (scene s): cały polski internet 0.10 · 6 1.88 · osób 2.14 · każdego dnia 2.48 · 59 złotych 4.14 · 3 paczki papierosów 5.90
      // a precise grid of people (one dot = many internet users); six of them light up
      const cv = K.$("#cv"), cx = cv.getContext("2d");
      const X0 = 900, Y0 = 70, COLS = 84, ROWS = 78, GAP = 12;
      const rnd = K.rng(26), tw = [];
      const ord = [];
      for (let i = 0; i < COLS * ROWS; i++) { tw.push(0.35 + rnd() * 0.65); ord.push(rnd()); }
      const SIX = [[22, 18], [57, 25], [36, 41], [70, 47], [15, 58], [48, 66]];
      const st = { a: 0, on: [0, 0, 0, 0, 0, 0], dim: 1 };
      function draw() {
        cx.clearRect(0, 0, 1920, 1080);
        for (let i = 0; i < COLS * ROWS; i++) {
          const k = Math.min(1, Math.max(0, (st.a * 1.25 - ord[i]) * 4)); if (k <= 0) continue;
          const c = i % COLS, r = (i / COLS) | 0;
          cx.fillStyle = `rgba(125,135,155,${0.8 * tw[i] * st.dim * k})`;
          cx.fillRect(X0 + c * GAP, Y0 + r * GAP, 3, 3);
        }
        SIX.forEach(([c, r], i) => {
          const g = st.on[i]; if (g <= 0) return;
          const x = X0 + c * GAP + 1.5, y = Y0 + r * GAP + 1.5, rad = 2 + 9 * g;
          cx.fillStyle = "#3d7bff"; cx.beginPath(); cx.arc(x, y, rad, 0, 6.2832); cx.fill();
          cx.strokeStyle = `rgba(61,123,255,${0.5 * g})`; cx.lineWidth = 2;
          cx.beginPath(); cx.arc(x, y, rad + 10 + 6 * (1 - g), 0, 6.2832); cx.stroke();
        });
      }
      const tl = K.tl; K.frame(draw);
      tl.fromTo("#cam", { scale: 1.08, transformOrigin: "1400px 500px" }, { scale: 1, duration: 7.0, ease: "sine.out" }, 0);
      tl.to(st, { a: 1, duration: 1.4, ease: "power2.inOut" }, 0.05);
      K.rise("#h1", 0.08);
      K.lift("#sub", 0.4, { y: 18, dur: 0.5 });
      K.count("#users", 0, 30000000, 0.45, 1.3, (v) => "~" + K.pl(v), "expo.out");
      tl.to(st, { dim: 0.45, duration: 0.6, ease: "power2.out" }, 1.75);
      SIX.forEach((_, i) => tl.to(st.on, { [i]: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.86 + i * 0.09));
      K.rise("#n6", 1.84, { dur: 0.7 });
      K.rise("#l6a", 2.1); K.rise("#l6b", 2.45);
      tl.to(["#h1", "#sub"], { opacity: 0.35, duration: 0.5, ease: "sine.inOut" }, 2.7);
      K.rise("#eqr", 4.05, { stagger: 0.04 });
      K.lift("#eqs", 4.3, { y: 24, dur: 0.6, ease: "expo.out" });
      K.count("#sum", 0, 10620, 4.35, 1.3, (v) => K.pl(v) + " zł", "power3.out");
      K.whip(7.0);
      K.done();
    </script>
  </body>
</html>
