<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<title>T10 device</title>
<link rel="stylesheet" href="studio.css" />
<script src="gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  /* The film's narrative device: a map of the whole video (one tile per chapter).
     mode: agenda (all tiles appear, nothing done) | progress (tiles up to `done` checked, current glows) | final (all checked). */
  .wrap { position: absolute; inset: 0; padding: 0 140px; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
  .wrap h2 { margin: 0; font: 600 96px/1.02 var(--f-sans); letter-spacing: -0.045em; color: var(--ink); text-wrap: balance; }
  .wrap h2 .accent { color: var(--accent); }
  .tiles { display: grid; gap: 22px; }
  .tile { position: relative; padding: 34px 32px 36px; min-height: 250px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .k { font: 500 28px/1 var(--f-mono); color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; }
  .tile .t { font: 600 46px/1.08 var(--f-sans); letter-spacing: -0.025em; color: var(--ink); text-wrap: balance; }
  .tile .chk { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; opacity: 0; }
  .tile.cur { box-shadow: var(--shadow), 0 0 0 3px var(--accent); }
  .tile.cur .k { color: var(--accent); }
  .tile.todo .t { color: var(--ink-2); }
</style>
</head>
<body class="opaque">
<div id="root" data-composition-id="anim" data-width="__W__" data-height="__H__" data-duration="__DURATION__" style="width:__W__px;height:__H__px">
  <div class="stage-bg clip" data-start="0" data-duration="__DURATION__" data-track-index="0"></div>
  <section class="clip fill" data-start="0" data-duration="__DURATION__" data-track-index="1">
    <div class="wrap"><h2 id="h"></h2><div class="tiles" id="tiles"></div></div>
  </section>
</div>
<script>
  const DATA = /*__DATA__*/{};
  const f = S.init(DATA);
  const p = DATA.params || {};
  const D = __DURATION__;
  const chapters = (f.device && f.device.chapters) || p.chapters || ["Jeden", "Dwa", "Trzy"];
  const mode = p.mode || "agenda";
  const done = mode === "final" ? chapters.length : (p.done || 0);
  const tiles = document.getElementById("tiles");
  tiles.style.gridTemplateColumns = `repeat(${Math.min(chapters.length, 5)}, 1fr)`;
  tiles.innerHTML = chapters.map((c, i) => {
    const st = i < done ? "done" : (mode === "progress" && i === done ? "cur" : "todo");
    return `<div class="tile card ${st}"><div class="k"><span>${String(i + 1).padStart(2, "0")}</span><span class="chk">${S.icon("check", 26)}</span></div><div class="t">${c}</div></div>`;
  }).join("");
  const hw = S.words(document.getElementById("h"), p.title || (mode === "final" ? "Wszystko w jednym miejscu" : "Plan na ten film"), p.accent || []);
  const tl = gsap.timeline({ paused: true });
  S.inWords(tl, hw, 0.12);
  const ts = tiles.querySelectorAll(".tile");
  S.inBlock(tl, ts, 0.45, { stagger: p.stagger || 0.16 });
  const base = 0.45 + ts.length * (p.stagger || 0.16) + 0.4;
  tiles.querySelectorAll(".tile.done .chk").forEach((c, i) => tl.fromTo(c, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, base + i * 0.18));
  S.register("anim", tl);
</script>
</body>
</html>
