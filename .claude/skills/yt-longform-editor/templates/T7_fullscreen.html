<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<title>T7 fullscreen</title>
<link rel="stylesheet" href="studio.css" />
<script src="gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  /* Full-screen graphic under the speaker's voice. One idea per frame.
     variant: statement | number | compare | list */
  .scene { position: absolute; inset: 0; padding: 120px 160px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
  .scene.center { align-items: center; text-align: center; }
  .eyebrow { font: 500 36px/1 var(--f-sans); color: var(--ink-2); letter-spacing: -0.005em; margin-bottom: 26px; }
  .statement { font: 600 124px/1.0 var(--f-sans); letter-spacing: -0.05em; color: var(--ink); max-width: 1500px; text-wrap: balance; }
  .statement.weight { font-weight: 300; } .statement .acc-weight { font-weight: 650; }
  .sub { font: 400 36px/1.3 var(--f-sans); color: var(--ink-2); margin-top: 34px; max-width: 1100px; }
  .bignum { font: 600 260px/0.9 var(--f-sans); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .bignum .u { font-size: 0.34em; font-weight: 500; letter-spacing: -0.02em; margin-left: 18px; color: var(--ink-2); }
  .bignum.acc { color: var(--accent); }
  .numlab { font: 500 50px/1.2 var(--f-sans); color: var(--ink); margin-top: 34px; letter-spacing: -0.015em; max-width: 1200px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; max-width: 1500px; }
  .cmp .c { padding: 64px 64px; display: flex; flex-direction: column; gap: 22px; }
  .cmp .lab { font: 500 38px/1 var(--f-sans); color: var(--ink-2); }
  .cmp .val { font: 600 132px/1 var(--f-sans); letter-spacing: -0.045em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cmp .note { font: 400 34px/1.3 var(--f-sans); color: var(--ink-2); }
  .cmp .c.win { box-shadow: var(--shadow), 0 0 0 3px var(--accent); }
  .cmp .c.lose .val { color: var(--ink-3); }
  .list { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 1300px; }
  .list h3 { margin: 0 0 18px; font: 600 72px/1.05 var(--f-sans); letter-spacing: -0.04em; color: var(--ink); }
  .list .r { display: flex; align-items: center; gap: 28px; padding: 26px 34px; }
  .list .r .k { font: 500 30px/1 var(--f-mono); color: var(--accent); width: 52px; }
  .list .r .t { font: 600 52px/1.1 var(--f-sans); letter-spacing: -0.025em; color: var(--ink); }
  .list .r .sub2 { font: 400 28px/1.25 var(--f-sans); color: var(--ink-2); margin-top: 6px; }
</style>
</head>
<body class="opaque">
<div id="root" data-composition-id="anim" data-width="__W__" data-height="__H__" data-duration="__DURATION__" style="width:__W__px;height:__H__px">
  <div class="stage-bg clip" data-start="0" data-duration="__DURATION__" data-track-index="0"></div>
  <section class="clip fill" data-start="0" data-duration="__DURATION__" data-track-index="1">
    <div class="scene" id="scene"></div>
  </section>
</div>
<script>
  const DATA = /*__DATA__*/{};
  const f = S.init(DATA);
  const p = DATA.params || {};
  const W = __W__, H = __H__, D = __DURATION__;
  const scene = document.getElementById("scene");
  const v = p.variant || "statement";
  const tl = gsap.timeline({ paused: true });
  const t0 = p.delay || 0.15;
  const fmt = (n, d) => Number(n).toLocaleString("pl-PL", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });

  if (p.align === "center" || v === "number") scene.classList.add("center");
  let html = p.eyebrow ? `<div class="eyebrow" id="eb">${p.eyebrow}</div>` : "";
  if (v === "statement") {
    html += `<div class="statement ${p.style === "weight" ? "weight" : ""}" id="st"></div>` + (p.sub ? `<div class="sub" id="sub">${p.sub}</div>` : "");
    scene.innerHTML = html;
    const st = document.getElementById("st");
    if (p.size) st.style.fontSize = p.size + "px";
    const ws = S.words(st, p.text || "", p.accent || [], p.style);
    if (p.eyebrow) S.inWords(tl, "#eb", t0, { y: 8 });
    S.inWords(tl, ws, t0 + 0.1, { stagger: p.stagger || 0.09, y: 22, blur: 10 });
    if (p.sub) S.inWords(tl, "#sub", t0 + 0.4 + ws.length * 0.09, { y: 10 });
  } else if (v === "number") {
    html += `<div class="bignum ${p.accentNumber ? "acc" : ""}" id="bn"><span id="nv"></span><span class="u">${p.unit || ""}</span></div><div class="numlab" id="nl">${p.label || ""}</div>`;
    scene.innerHTML = html;
    if (p.eyebrow) S.inWords(tl, "#eb", t0, { y: 8 });
    S.inBlock(tl, "#bn", t0 + 0.05, { scale: 0.96 });
    S.roll(tl, document.getElementById("nv"), Number(p.value || 0), t0 + 0.1, { from: p.from || 0, dur: p.rollDur || 1.4, decimals: p.decimals || 0, prefix: p.prefix || "", suffix: p.suffix || "" });
    S.inWords(tl, "#nl", t0 + 0.6, { y: 12 });
  } else if (v === "compare") {
    const a = p.a || {}, b = p.b || {};
    const card = (x, cls) => `<div class="c card ${cls}"><div class="lab">${x.label || ""}</div><div class="val">${x.value || ""}</div>${x.note ? `<div class="note">${x.note}</div>` : ""}</div>`;
    html += `<div class="cmp">${card(a, p.winner === "a" ? "win" : p.winner === "b" ? "lose" : "")}${card(b, p.winner === "b" ? "win" : p.winner === "a" ? "lose" : "")}</div>`;
    scene.innerHTML = html;
    if (p.eyebrow) S.inWords(tl, "#eb", t0, { y: 8 });
    const cs = scene.querySelectorAll(".c");
    S.inBlock(tl, cs[0], a.at != null ? a.at : t0 + 0.1);
    S.inBlock(tl, cs[1], b.at != null ? b.at : t0 + 0.9);
  } else if (v === "list") {
    html += `<div class="list">${p.title ? `<h3 id="lt"></h3>` : ""}` + (p.items || []).map((it, i) =>
      `<div class="r card"><div class="k">${it.icon ? `<span style="color:var(--accent)">${S.icon(it.icon, 34)}</span>` : String(i + 1).padStart(2, "0")}</div><div><div class="t">${it.title || ""}</div>${it.sub ? `<div class="sub2">${it.sub}</div>` : ""}</div></div>`).join("") + `</div>`;
    scene.innerHTML = html;
    let t = t0;
    if (p.title) { const lw = S.words(document.getElementById("lt"), p.title, p.accent || []); S.inWords(tl, lw, t); t += 0.4; }
    scene.querySelectorAll(".r").forEach((r, i) => S.inBlock(tl, r, p.items[i].at != null ? p.items[i].at : t + i * 0.45, { stagger: 0 }));
  }
  if (p.exit) S.out(tl, scene, D - S.T_OUT - 0.04);   // full screens hard-cut back to the face by default
  S.register("anim", tl);
</script>
</body>
</html>
